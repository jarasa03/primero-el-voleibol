services:
    app:
        image: ghcr.io/jarasa03/primero-el-voleibol:latest
        container_name: primero-el-voleibol
        platform: linux/amd64
        restart: unless-stopped
        ports:
            - "8080:80"
        env_file:
            - .env
        volumes:
            - ./data/sqlite:/data
            - ./data/storage:/app/storage
        healthcheck:
            test:
                - CMD-SHELL
                - curl -fsS http://127.0.0.1/up >/dev/null || exit 1
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 90s
        stop_grace_period: 30s
