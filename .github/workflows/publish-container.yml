name: Deploy to OVH

on:
  push:
    branches:
      - main
concurrency:
  group: deploy-ovh-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy to OVH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://primero-el-voleibol.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      OVH_HOST: ${{ secrets.OVH_HOST }}
      OVH_USER: ${{ secrets.OVH_USER }}
      OVH_PORT: ${{ secrets.OVH_PORT }}
      OVH_PATH: /home/primerv/primeroelvoleibol
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, intl, mbstring, gd, zip, bcmath
          coverage: none
          tools: composer

      - name: Prepare temporary CI environment
        run: cp .env.example .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer/files
            ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup modern Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite manifest
        shell: bash
        run: test -f public/build/manifest.json

      - name: Verify published Laravel assets
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_ASSETS=(
            public/css/filament
            public/fonts/filament
            public/js/filament
            public/vendor/livewire
          )
          php artisan livewire:publish --assets
          if [ -n "$(git status --porcelain -- "${PUBLISHED_ASSETS[@]}")" ]; then
            echo 'Published Filament/Livewire assets differ from the committed assets.' >&2
            git status --short -- "${PUBLISHED_ASSETS[@]}" >&2
            exit 1
          fi

      - name: Generate temporary application key
        run: php artisan key:generate --force

      - name: Validate Composer configuration
        run: composer validate --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

      - name: Trust OVH SSH host key
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Update OVH application
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"

          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/primerv/primeroelvoleibol
          git fetch origin main
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)public/.htaccess')" ]; then
            echo 'Refusing deploy: the production checkout contains changes outside public/.htaccess.' >&2
            git status --short --untracked-files=all -- . ':(exclude)public/.htaccess' >&2
            exit 1
          fi
          if ! git diff --quiet HEAD origin/main -- public/.htaccess; then
            echo 'Refusing deploy: the incoming revision changes public/.htaccess.' >&2
            exit 1
          fi
          if ! git diff --quiet --cached -- public/.htaccess; then
            echo 'Refusing deploy: public/.htaccess has staged changes.' >&2
            exit 1
          fi
          HTACCESS_BACKUP="$(mktemp)"
          cp -p public/.htaccess "$HTACCESS_BACKUP"
          restore_htaccess() {
            cp -p "$HTACCESS_BACKUP" public/.htaccess
            rm -f "$HTACCESS_BACKUP"
          }
          trap restore_htaccess EXIT
          if ! git diff --quiet -- public/.htaccess; then
            git stash push --message 'preserve production public/.htaccess during deploy' -- public/.htaccess
            HTACCESS_STASHED=true
          else
            HTACCESS_STASHED=false
          fi
          git checkout main
          git pull --ff-only origin main
          if [ "$HTACCESS_STASHED" = true ]; then
            git stash pop
          fi
          cp -p "$HTACCESS_BACKUP" public/.htaccess
          php /home/primerv/composer.phar install --no-dev --no-scripts --optimize-autoloader --no-interaction
          php artisan package:discover --ansi
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          if [ -e public/storage ] || [ -L public/storage ]; then
            test -L public/storage
            test "$(readlink public/storage)" = '../storage/app/public'
          else
            ln -s ../storage/app/public public/storage
          fi
          REMOTE

      - name: Upload compiled frontend assets to OVH
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"

          BUILD_STAGING="$OVH_PATH/public/build.next.${GITHUB_SHA}"
          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" \
            "mkdir -p '$BUILD_STAGING'"
          scp -r -P "$SSH_PORT" public/build/. \
            "$OVH_USER@$OVH_HOST:$BUILD_STAGING/"
          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" \
            "GITHUB_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /home/primerv/primeroelvoleibol
          BUILD_STAGING="public/build.next.${GITHUB_SHA}"
          BUILD_BACKUP=".deploy-backups/builds/${GITHUB_SHA}"
          test -f "$BUILD_STAGING/manifest.json"
          find "$BUILD_STAGING" -type d -exec chmod 755 {} +
          find "$BUILD_STAGING" -type f -exec chmod 644 {} +
          test ! -e "$BUILD_BACKUP"
          mkdir -p "$(dirname "$BUILD_BACKUP")"
          if [ -e public/build ] || [ -L public/build ]; then
            mv public/build "$BUILD_BACKUP"
          fi
          if ! mv "$BUILD_STAGING" public/build; then
            if [ -e "$BUILD_BACKUP" ] || [ -L "$BUILD_BACKUP" ]; then
              mv "$BUILD_BACKUP" public/build
            fi
            exit 1
          fi
          REMOTE
