name: Deploy to OVH

on:
  push:
    branches:
      - main
concurrency:
  group: deploy-ovh-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Test, build and deploy to OVH
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_URL: http://primero-el-voleibol.test
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      OVH_HOST: ${{ secrets.OVH_HOST }}
      OVH_USER: ${{ secrets.OVH_USER }}
      OVH_PORT: ${{ secrets.OVH_PORT }}
      OVH_PATH: /home/primerv/primeroelvoleibol
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, intl, mbstring, gd, zip, bcmath
          coverage: none
          tools: composer

      - name: Prepare temporary CI environment
        run: cp .env.example .env

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/composer/files
            ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Setup modern Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify Vite manifest
        shell: bash
        run: test -f public/build/manifest.json

      - name: Generate temporary application key
        run: php artisan key:generate --force

      - name: Validate Composer configuration
        run: composer validate --no-interaction

      - name: Run Laravel tests
        run: php artisan test

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.OVH_SSH_PRIVATE_KEY }}

      - name: Trust OVH SSH host key
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$SSH_PORT" "$OVH_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Update OVH application
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"

          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/primerv/primeroelvoleibol
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- public/.htaccess; then
            echo 'Refusing deploy: public/.htaccess differs between deployed and incoming revisions.' >&2
            exit 1
          fi
          git checkout main
          git pull --ff-only origin main
          php /home/primerv/composer.phar install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan optimize:clear
          php artisan optimize
          rm -f public/storage
          ln -s ../storage/app/public public/storage
          REMOTE

      - name: Upload compiled frontend assets to OVH
        shell: bash
        run: |
          set -euo pipefail
          SSH_PORT="${OVH_PORT:-22}"

          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" \
            "rm -rf '$OVH_PATH/public/build.next' && mkdir -p '$OVH_PATH/public/build.next'"
          scp -r -P "$SSH_PORT" public/build/. \
            "$OVH_USER@$OVH_HOST:$OVH_PATH/public/build.next/"
          ssh -p "$SSH_PORT" "$OVH_USER@$OVH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/primerv/primeroelvoleibol
          rm -rf public/build
          mv public/build.next public/build
          find public/build -type d -exec chmod 755 {} +
          find public/build -type f -exec chmod 644 {} +
          REMOTE
